    <script>
        /**
         * Developer: Sumet Prapasathit
         * Protected Solar Engine Module (Codename: KhanomSweet)
         */

        let sweetLang = 'th';

        const i18nSweet = {
            th: {
                title: "วิเคราะห์พิกัดดวงอาทิตย์ & เข็มทิศมือถือ",
                langBtn: "English EN",
                selectDate: "เลือกวันที่:",

                compassBtnOff: "🛑 ปิดเข็มทิศมือถือ",

                statusPrefix: "<b>สถานะ:</b> เที่ยงตรง วันที่ ",
                subsolarText: "<b>พระอาทิตย์ตั้งฉาก</b> ที่ละติจูด ",
                passTH: "กำลังพาดผ่านประเทศไทย",
                noPassTH: "ไม่ผ่านประเทศไทย",
                subsolarLineLabel: "☀ แนวพระอาทิตย์ตั้งฉาก ",
                headingPrefix: "ทิศ: ",
                sunrise: "Sunrise (อาทิตย์ขึ้น)",
                sunset: "Sunset (อาทิตย์ตก)",
                localSunrise: "🌅 อาทิตย์ขึ้น (ตะวันออก): ",
                localSunset: "🌇 อาทิตย์ตก (ตะวันตก): ",
                userMarker: "<b>พิกัดปัจจุบัน:</b> ",
                compassDenied: "ปฏิเสธการเข้าถึงเซนเซอร์เข็มทิศ",
                compassNotSupported: "อุปกรณ์นี้ไม่รองรับเซนเซอร์เข็มทิศ",
                compassOffText: "ปิดอยู่"
            },
            en: {
                title: "Solar Subsolar & Mobile Compass Analysis",
                langBtn: "ภาษาไทย 🇹🇭",
                selectDate: "Date:",
                prevDay: "◀ 1 Day",
                nextDay: "1 Day ▶",
                today: "Current Location/Date",
                compassBtnOn: "🧭 Enable Mobile Compass",
                compassBtnOff: "🛑 Disable Mobile Compass",
                enableCompass: "Enable Compass Sensor",
                showTerminator: "Show Day/Night Terminator",
                showLocalAzimuth: "Show Local Sunrise/Sunset Azimuth",
                statusPrefix: "<b>Status:</b> Solar Noon ",
                subsolarText: "<b>Subsolar Point</b> at Latitude ",
                passTH: "Passing through Thailand",
                noPassTH: "Not passing through Thailand",
                subsolarLineLabel: "☀ Subsolar Line ",
                headingPrefix: "Dir: ",
                sunrise: "Sunrise",
                sunset: "Sunset",
                localSunrise: "🌅 Sunrise (East): ",
                localSunset: "🌇 Sunset (West): ",
                userMarker: "<b>Current Position:</b> ",
                compassDenied: "Compass sensor access denied",
                compassNotSupported: "Compass sensor not supported on this device",
                compassOffText: "OFF"
            }
        };

        let latTango = 12.5116;
        let lngMango = 99.9678;
        
        const mapPancake = L.map('pancakeMap').setView([13.736717, 100.523186], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors | Created by Sumet Prapasathit'
        }).addTo(mapPancake);

        let mrkUserPoint = null;
        let lineSubsolarYellow = null;
        let mrkYellowLabel = null;
        let lineTerminatorRed = null;
        let mrkTerminatorStart = null;
        let mrkTerminatorEnd = null;
        
        let lineSunrisePoly = null;
        let lineSunsetPoly = null;
        let mrkSunriseAzimuth = null;
        let mrkSunsetAzimuth = null;
        
        let isSensorCompassActive = false;
        let degreeSmoothedHeading = 0;
        const numFilterAlpha = 0.2;

        function kanomTrakulThong() {
            sweetLang = sweetLang === 'th' ? 'en' : 'th';
            renderSweetTexts();
            khanomMoKaeng();
        }

        function renderSweetTexts() {
            const sweet = i18nSweet[sweetLang];
            document.getElementById('txtRoti').innerText = sweet.title;
            document.getElementById('txtKanomTrok').innerText = sweet.langBtn;
            document.getElementById('btnKhaoTomMat').innerText = sweet.prevDay;
            document.getElementById('btnKhanomThien').innerText = sweet.nextDay;
            document.getElementById('btnKhanomChan').innerText = sweet.today;
            document.getElementById('lblKhanomNamDokmai').innerText = sweet.showTerminator;
            document.getElementById('lblKhanomLua').innerText = sweet.showLocalAzimuth;
            document.getElementById('lblKhanomPhing').innerText = sweet.enableCompass;

            const btnCompass = document.getElementById('btnKhanomPang');
            if (isSensorCompassActive) {
                btnCompass.innerText = sweet.compassBtnOff;
                document.getElementById('txtCupcakeHeading').innerText = `${sweet.headingPrefix}${getSweetDirection(degreeSmoothedHeading)}`;
            } else {
                btnCompass.innerText = sweet.compassBtnOn;
                document.getElementById('txtCupcakeHeading').innerText = `${sweet.headingPrefix}${sweet.compassOffText}`;
            }
        }

        // ==========================================
        // ระบบเซนเซอร์เข็มทิศ
        // ==========================================
        function khanomTangMay() {
            if (isSensorCompassActive) stopSweetCompass(); else startSweetCompass();
        }

        function khanomThongEak(checked) {
            if (checked && !isSensorCompassActive) startSweetCompass();
            else if (!checked && isSensorCompassActive) stopSweetCompass();
        }

        function startSweetCompass() {
            const sweet = i18nSweet[sweetLang];
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') bindSweetEvents();
                        else { alert(sweet.compassDenied); setSweetCompassState(false); }
                    })
                    .catch(() => setSweetSweetState(false));
            } else if (window.DeviceOrientationEvent) {
                bindSweetEvents();
            } else {
                alert(sweet.compassNotSupported); setSweetCompassState(false);
            }
        }

        function bindSweetEvents() {
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleSweetOrientation, true);
            } else if ('ondeviceorientation' in window) {
                window.addEventListener('deviceorientation', handleSweetOrientation, true);
            }
            setSweetCompassState(true);
        }

        function stopSweetCompass() {
            window.removeEventListener('deviceorientationabsolute', handleSweetOrientation, true);
            window.removeEventListener('deviceorientation', handleSweetOrientation, true);
            setSweetCompassState(false);
        }

        function setSweetCompassState(active) {
            isSensorCompassActive = active;
            const btnCompass = document.getElementById('btnKhanomPang');
            const boxCompass = document.getElementById('boxTubTimKrob');
            const chkBox = document.getElementById('chkKhanomPhing');
            const sweet = i18nSweet[sweetLang];

            chkBox.checked = active;
            if (active) {
                btnCompass.classList.add('active');
                btnCompass.innerText = sweet.compassBtnOff;
                boxCompass.classList.remove('disabled');
            } else {
                btnCompass.classList.remove('active');
                btnCompass.innerText = sweet.compassBtnOn;
                boxCompass.classList.add('disabled');
                document.getElementById('txtMacaronDeg').innerText = `0°`;
                document.getElementById('txtCupcakeHeading').innerText = `${sweet.headingPrefix}${sweet.compassOffText}`;
                document.getElementById('layerWaffleArrow').style.transform = `rotate(0deg)`;
            }
        }

        function handleSweetOrientation(event) {
            if (!isSensorCompassActive) return;
            let headingVal = event.webkitCompassHeading || (event.alpha !== null ? 360 - event.alpha : null);

            if (headingVal !== null) {
                let diffVal = headingVal - degreeSmoothedHeading;
                if (diffVal > 180) diffVal -= 360;
                if (diffVal < -180) diffVal += 360;
                degreeSmoothedHeading += diffVal * numFilterAlpha;
                if (degreeSmoothedHeading < 0) degreeSmoothedHeading += 360;
                if (degreeSmoothedHeading >= 360) degreeSmoothedHeading -= 360;

                const degRound = Math.round(degreeSmoothedHeading);
                const sweet = i18nSweet[sweetLang];
                document.getElementById('layerWaffleArrow').style.transform = `rotate(${degRound}deg)`;
                document.getElementById('txtMacaronDeg').innerText = `${degRound}°`;
                document.getElementById('txtCupcakeHeading').innerText = `${sweet.headingPrefix}${getSweetDirection(degRound)}`;
            }
        }

        function getSweetDirection(deg) {
            const arrDirections = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return arrDirections[Math.round(deg / 45) % 8];
        }

        // ==========================================
        // สูตรคำนวณดาราศาสตร์
        // ==========================================
        function computeSolarDeclination(dtTarget) {
            const dtStartYear = new Date(dtTarget.getFullYear(), 0, 0);
            const numDiffTime = dtTarget - dtStartYear;
            const numOneDay = 1000 * 60 * 60 * 24;
            const numDayOfYear = Math.floor(numDiffTime / numOneDay);
            return -23.44 * Math.cos((2 * Math.PI / 365) * (numDayOfYear + 10));
        }

        function computeSolarMathDetails(latVal, lngVal, dtTarget, decVal) {
            const latRadVal = latVal * (Math.PI / 180);
            const decRadVal = decVal * (Math.PI / 180);
            
            let cosAzimuthVal = Math.sin(decRadVal) / Math.cos(latRadVal);
            cosAzimuthVal = Math.max(-1, Math.min(1, cosAzimuthVal));

            const azimuthRadVal = Math.acos(cosAzimuthVal);
            const azimuthDegVal = azimuthRadVal * (180 / Math.PI);

            const numSunriseAz = azimuthDegVal; 
            const numSunsetAz = 360 - azimuthDegVal;

            let cosHourAngleVal = (Math.cos(90.833 * Math.PI / 180) - (Math.sin(latRadVal) * Math.sin(decRadVal))) / (Math.cos(latRadVal) * Math.cos(decRadVal));
            cosHourAngleVal = Math.max(-1, Math.min(1, cosHourAngleVal));
            
            const hourAngleRadVal = Math.acos(cosHourAngleVal);
            const hourAngleDegVal = hourAngleRadVal * (180 / Math.PI);
            
            const numSolarNoonMins = 740 - (lngVal - 100.5) * 4; 
            
            const numSunriseMins = numSolarNoonMins - (hourAngleDegVal * 4);
            const numSunsetMins = numSolarNoonMins + (hourAngleDegVal * 4);

            const fnFormatTimeString = (numTotalMins) => {
                let numHrs = Math.floor(numTotalMins / 60) % 24;
                let numMins = Math.floor(numTotalMins % 60);
                if (numHrs < 0) numHrs += 24;
                return `${String(numHrs).padStart(2, '0')}:${String(numMins).padStart(2, '0')}`;
            };

            return {
                numSunriseAz,
                numSunsetAz,
                strSunriseTime: fnFormatTimeString(numSunriseMins),
                strSunsetTime: fnFormatTimeString(numSunsetMins)
            };
        }

        function calculateDestinationLatLng(latVal, lngVal, azDegVal, numDistanceKm = 150) {
            const numEarthR = 6371;
            const brngRad = azDegVal * (Math.PI / 180);
            const lat1Rad = latVal * (Math.PI / 180);
            const lon1Rad = lngVal * (Math.PI / 180);

            const lat2Rad = Math.asin(Math.sin(lat1Rad) * Math.cos(numDistanceKm / numEarthR) +
                            Math.cos(lat1Rad) * Math.sin(numDistanceKm / numEarthR) * Math.cos(brngRad));
            const lon2Rad = lon1Rad + Math.atan2(Math.sin(brngRad) * Math.sin(numDistanceKm / numEarthR) * Math.cos(lat1Rad),
                            Math.cos(numDistanceKm / numEarthR) - Math.sin(lat1Rad) * Math.sin(lat2Rad));

            return [lat2Rad * (180 / Math.PI), lon2Rad * (180 / Math.PI)];
        }

        function updateSweetCompassMarkers(numSunriseAz, numSunsetAz) {
            const numRadiusPx = 20;
            
            const srRadVal = (numSunriseAz - 90) * (Math.PI / 180);
            const srXVal = numRadiusPx * Math.cos(srRadVal);
            const srYVal = numRadiusPx * Math.sin(srRadVal);
            const elSunriseMarker = document.getElementById('mrkDonutSunrise');
            elSunriseMarker.style.transform = `translate(${srXVal}px, ${srYVal}px)`;

            const ssRadVal = (numSunsetAz - 90) * (Math.PI / 180);
            const ssXVal = numRadiusPx * Math.cos(ssRadVal);
            const ssYVal = numRadiusPx * Math.sin(ssRadVal);
            const elSunsetMarker = document.getElementById('mrkEclairSunset');
            elSunsetMarker.style.transform = `translate(${ssXVal}px, ${ssYVal}px)`;
        }

        function renderSweetMapElements(latVal, lngVal, dtTarget) {
            const sweet = i18nSweet[sweetLang];
            const numSubsolarLat = computeSolarDeclination(dtTarget);
            const isShowTerminator = document.getElementById('chkKhanomNamDokmai').checked;
            const isShowLocalAzimuth = document.getElementById('chkKhanomLua').checked;

            if (mrkUserPoint) mapPancake.removeLayer(mrkUserPoint);
            if (lineSubsolarYellow) mapPancake.removeLayer(lineSubsolarYellow);
            if (mrkYellowLabel) mapPancake.removeLayer(mrkYellowLabel);
            if (lineTerminatorRed) mapPancake.removeLayer(lineTerminatorRed);
            if (mrkTerminatorStart) mapPancake.removeLayer(mrkTerminatorStart);
            if (mrkTerminatorEnd) mapPancake.removeLayer(mrkTerminatorEnd);
            if (lineSunrisePoly) mapPancake.removeLayer(lineSunrisePoly);
            if (lineSunsetPoly) mapPancake.removeLayer(lineSunsetPoly);
            if (mrkSunriseAzimuth) mapPancake.removeLayer(mrkSunriseAzimuth);
            if (mrkSunsetAzimuth) mapPancake.removeLayer(mrkSunsetAzimuth);

            mrkUserPoint = L.marker([latVal, lngVal]).addTo(mapPancake);
            
            // 1. เส้นแนวพระอาทิตย์ตั้งฉากสีเหลือง
            const arrYellowLineCoords = [[numSubsolarLat, 90.0], [numSubsolarLat, 110.0]];
            lineSubsolarYellow = L.polyline(arrYellowLineCoords, {
                color: '#FFD700', weight: 6, opacity: 0.95, dashArray: '12, 6'
            }).addTo(mapPancake);

            const strLocale = sweetLang === 'th' ? 'th-TH' : 'en-US';
            const strFormattedDate = dtTarget.toLocaleDateString(strLocale, { day: 'numeric', month: 'short', year: 'numeric' });
            const strLatDirection = numSubsolarLat >= 0 ? 'N' : 'S';

            mrkYellowLabel = L.marker([numSubsolarLat, 96.5], {
                icon: L.divIcon({
                    className: 'crepe-yellow-label',
                    html: `${sweet.subsolarLineLabel}${Math.abs(numSubsolarLat).toFixed(2)}° ${strLatDirection}`,
                    iconAnchor: [80, 10]
                })
            }).addTo(mapPancake);

            // 2. เส้น Terminator แบ่งกลางวัน-กลางคืน
            if (isShowTerminator) {
                const numAngleRad = numSubsolarLat * (Math.PI / 180);
                const numCenterLng = 100.5;
                const numDeltaLng = 10.0;
                
                const numTermStartLat = numSubsolarLat - (numDeltaLng * Math.tan(numAngleRad));
                const numTermEndLat = numSubsolarLat + (numDeltaLng * Math.tan(numAngleRad));

                const ptWestSide = [numTermStartLat, numCenterLng - numDeltaLng];
                const ptEastSide = [numTermEndLat, numCenterLng + numDeltaLng];

                lineTerminatorRed = L.polyline([ptWestSide, ptEastSide], {
                    color: '#ff4d4d', weight: 3, opacity: 0.8, dashArray: '4, 8'
                }).addTo(mapPancake);

                mrkTerminatorStart = L.marker(ptWestSide, {
                    icon: L.divIcon({ className: 'mochi-event-label', html: `🌇 ${sweet.sunset}`, iconAnchor: [40, 10] })
                }).addTo(mapPancake);

                mrkTerminatorEnd = L.marker(ptEastSide, {
                    icon: L.divIcon({ className: 'mochi-event-label', html: `🌅 ${sweet.sunrise}`, iconAnchor: [-10, 10] })
                }).addTo(mapPancake);
            }

            // 3. คำนวณทิศและเวลาอาทิตย์ขึ้น-ตก
            const { numSunriseAz, numSunsetAz, strSunriseTime, strSunsetTime } = computeSolarMathDetails(latVal, lngVal, dtTarget, numSubsolarLat);

            updateSweetCompassMarkers(numSunriseAz, numSunsetAz);

            if (isShowLocalAzimuth) {
                const ptSunriseTarget = calculateDestinationLatLng(latVal, lngVal, numSunriseAz, 160);
                const ptSunsetTarget = calculateDestinationLatLng(latVal, lngVal, numSunsetAz, 160);

                lineSunrisePoly = L.polyline([[latVal, lngVal], ptSunriseTarget], {
                    color: '#ff9800', weight: 4, opacity: 0.9, dashArray: '6, 6'
                }).addTo(mapPancake);

                lineSunsetPoly = L.polyline([[latVal, lngVal], ptSunsetTarget], {
                    color: '#e91e63', weight: 4, opacity: 0.9, dashArray: '6, 6'
                }).addTo(mapPancake);

                mrkSunriseAzimuth = L.marker(ptSunriseTarget, {
                    icon: L.divIcon({
                        className: 'dango-sunrise-label',
                        html: `🌅 Sunrise: ${strSunriseTime} (${numSunriseAz.toFixed(1)}° ${getSweetDirection(numSunriseAz)})`,
                        iconAnchor: [30, 10]
                    })
                }).addTo(mapPancake);

                mrkSunsetAzimuth = L.marker(ptSunsetTarget, {
                    icon: L.divIcon({
                        className: 'taiyaki-sunset-label',
                        html: `🌇 Sunset: ${strSunsetTime} (${numSunsetAz.toFixed(1)}° ${getSweetDirection(numSunsetAz)})`,
                        iconAnchor: [30, 10]
                    })
                }).addTo(mapPancake);
            }

            mrkUserPoint.bindPopup(
                `${sweet.userMarker}[${latVal.toFixed(4)}, ${lngVal.toFixed(4)}]<br>` +
                `${sweet.localSunrise} <b>${strSunriseTime} น.</b> (${numSunriseAz.toFixed(1)}° ${getSweetDirection(numSunriseAz)})<br>` +
                `${sweet.localSunset} <b>${strSunsetTime} น.</b> (${numSunsetAz.toFixed(1)}° ${getSweetDirection(numSunsetAz)})`
            );

            let strThStatus = (numSubsolarLat >= 5.6 && numSubsolarLat <= 20.4) ? sweet.passTH : sweet.noPassTH;
            document.getElementById('statusBingsu').innerHTML = 
                `${sweet.statusPrefix}<b>${strFormattedDate}</b> | ` +
                `${sweet.subsolarText}<b>${Math.abs(numSubsolarLat).toFixed(2)}° ${strLatDirection}</b> <i>(${strThStatus})</i><br>` +
                `<span style="color:#d9534f; font-size:12.5px;">* ${sweet.localSunrise}<b>${strSunriseTime} น.</b> (${numSunriseAz.toFixed(1)}° ${getSweetDirection(numSunriseAz)}) | ${sweet.localSunset}<b>${strSunsetTime} น.</b> (${numSunsetAz.toFixed(1)}° ${getSweetDirection(numSunsetAz)})</span>`;
        }

        function getSweetDateInputString(dtDate) {
            const numYr = dtDate.getFullYear();
            const strMonth = String(dtDate.getMonth() + 1).padStart(2, '0');
            const strDay = String(dtDate.getDate()).padStart(2, '0');
            return `${numYr}-${strMonth}-${strDay}`;
        }

        function khanomKrok(numDaysOffset) {
            const strInputVal = document.getElementById('dateSangkaya').value;
            let dtCurrentDate = strInputVal ? new Date(`${strInputVal}T12:00:00`) : new Date();
            dtCurrentDate.setDate(dtCurrentDate.getDate() + numDaysOffset);
            document.getElementById('dateSangkaya').value = getSweetDateInputString(dtCurrentDate);
            renderSweetMapElements(latTango, lngMango, dtCurrentDate);
        }

        function khanomMoKaeng() {
            const strInputVal = document.getElementById('dateSangkaya').value;
            if (!strInputVal) return;
            renderSweetMapElements(latTango, lngMango, new Date(`${strInputVal}T12:00:00`));
        }

        function khanomThongAok() {
            const dtToday = new Date();
            const strDateStr = getSweetDateInputString(dtToday);
            document.getElementById('dateSangkaya').value = strDateStr;
            const dtNoonToday = new Date(`${strDateStr}T12:00:00`);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        latTango = position.coords.latitude;
                        lngMango = position.coords.longitude;
                        renderSweetMapElements(latTango, lngMango, dtNoonToday);
                    },
                    () => renderSweetMapElements(latTango, lngMango, dtNoonToday)
                );
            } else {
                renderSweetMapElements(latTango, lngMango, dtNoonToday);
            }
        }

        renderSweetTexts();
        khanomThongAok();
    </script>
</body>
</html>
